# Generat pentru site-ul TopRox Project.
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Fiecare adresă e servită din fișierul ei HTML, generat la build (scripts/prerender.js).
# Adresele inexistente primesc automat 404.html, cu status 404.

